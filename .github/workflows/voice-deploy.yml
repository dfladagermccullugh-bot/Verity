# Deploys the Verity Voice server (the browser demo) to Fly.io.
#
# Manual only: run it from the Actions tab. Needs the repository secret FLY_API_TOKEN.
# The first run creates the Fly.io app; later runs update it.
#
# Voice keys are repository secrets too, and each deploy hands the server those that are set:
#   DEEPGRAM_API_KEY                       the demo hears through Deepgram and speaks with its voice
#   CARTESIA_API_KEY + CARTESIA_VOICE_ID   the demo speaks with Cartesia's voice instead
#   ANTHROPIC_API_KEY                      natural replies are read by Claude (otherwise by rules only)
# With none set, the demo uses the browser's built-in speech and understands exact answers only.
#
# Two tasks deploy nothing:
#   compare-voices   runs the voice comparison against the live vendors and keeps the audio
#   measure-model    scores the language model's reading of the labelled replies (a few cents)
name: voice-deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Fly.io app name (must be unique across Fly.io)"
        required: true
        default: "verity-voice-demo"
      task:
        description: "deploy the server; or compare-voices / measure-model (live checks; they deploy nothing)"
        type: choice
        options: [deploy, compare-voices, measure-model]
        default: deploy

permissions:
  contents: read

concurrency:
  group: voice-deploy
  cancel-in-progress: false

jobs:
  compare-voices:
    if: inputs.task == 'compare-voices'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: voice
    env:
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Render every line with each voice and hear it back
        run: npm run bakeoff -- --out bakeoff
      - name: Keep the audio to listen to
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-comparison
          path: voice/bakeoff
          if-no-files-found: ignore

  measure-model:
    if: inputs.task == 'measure-model'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: voice
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check the key is present
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "The repository secret ANTHROPIC_API_KEY is not set."; exit 1; fi
      - name: Read the labelled replies with the model and score it
        run: npm run -s eval -- --live --wrong | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    if: inputs.task != 'compare-voices' && inputs.task != 'measure-model'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: voice
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check the token is present
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "The repository secret FLY_API_TOKEN is not set."; exit 1; fi
          flyctl version
      - name: Create the app if it does not exist
        run: |
          if flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "App $APP already exists."
          else
            flyctl apps create "$APP" --org personal || flyctl apps create "$APP"
          fi
      - name: Hand the service keys to the server
        # Staged: they take effect with the release below. A key that is not set is left alone.
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          : > keys.env
          for name in DEEPGRAM_API_KEY CARTESIA_API_KEY CARTESIA_VOICE_ID ANTHROPIC_API_KEY; do
            if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}" >> keys.env; echo "$name: set, handing it to the server."; else echo "$name: not set in this repository's secrets."; fi
          done
          if [ -s keys.env ]; then flyctl secrets import --stage --app "$APP" < keys.env; fi
          rm -f keys.env
      - name: Deploy
        run: flyctl deploy --app "$APP" --remote-only --ha=false --wait-timeout 180
      - name: Start the machine
        # A release leaves a stopped machine stopped (for example one that crashed on an earlier image).
        run: |
          for id in $(flyctl machine list --app "$APP" --json | jq -r '.[].id'); do
            flyctl machine start "$id" --app "$APP" || true
          done
      - name: Check the server answers
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 20 "https://$APP.fly.dev/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "The server did not answer at https://$APP.fly.dev/health"; exit 1
      - name: What the server says (shown whether or not the deploy passed)
        if: always()
        run: |
          flyctl status --app "$APP" || true
          flyctl checks list --app "$APP" || true
          echo "----- server log -----"
          timeout 25 flyctl logs --app "$APP" --no-tail | tail -n 80 || true
          echo "----- health -----"
          curl -sS -m 15 -i "https://$APP.fly.dev/health" || true
