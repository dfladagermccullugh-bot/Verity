# Fly.io settings for the Verity Voice server. NOT YET DEPLOYED: no Fly account was available
# to the build. From voice/:  fly launch --no-deploy --copy-config   then   fly deploy
#
# Live phone calls are held in this process's memory, so the machine must stay up and there must
# be exactly one of it (the same reason phone_map runs this way).
app = "verity-voice"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  # Never stopped on purpose; but if it has stopped (for example after a failed release), wake it.
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
